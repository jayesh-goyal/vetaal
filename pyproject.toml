[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vetaal"
version = "1.0.0"
description = "Automated local security auditing framework."
readme = "README.md"
authors = [{ name = "Security Engineer", email = "developer@local.net" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "PyYAML>=6.0",
    "psutil>=5.9.0",
    "httpx>=0.24.0",
    "scapy>=2.5.0",
]
